.lg3-about{position:relative;width:min(420px,100%);max-height:calc(100vh - 130px);overflow:auto;background:rgba(8,48,74,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px;color:#FBF7F1;box-shadow:0 30px 80px rgba(3,26,39,.55);animation:lg3Rise .35s cubic-bezier(.2,.8,.2,1);transform-origin:bottom right}

.lg3-about-more{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14);color:rgba(251,247,241,.85);font-size:13.5px}

.lg3-glow .g1{width:620px;height:620px;background:radial-gradient(circle,rgba(235,154,106,.32),rgba(235,154,106,0) 70%)}

html[data-mode=day] .lg3-glow{mix-blend-mode:multiply}html[data-mode=day] .lg3-glow .g1{background:radial-gradient(circle,rgba(235,154,106,.22),rgba(235,154,106,0) 70%)}

html[data-mode=day][dir=rtl] .lg3-hero-shade{background:radial-gradient(560px 600px at 24% 48%,rgba(235,154,106,.28),transparent 70%),linear-gradient(270deg,#FBF7F1 0%,rgba(251,247,241,.92) 38%,rgba(251,247,241,.45) 72%,rgba(251,247,241,.35) 100%),linear-gradient(0deg,#FBF7F1 0%,transparent 30%),linear-gradient(180deg,rgba(251,247,241,.85),transparent 24%)}
html[data-mode=day] .lg3-hero .lg3-roles{color:rgba(8,48,74,.8)}html[data-mode=day] .lg3-hero .lg3-roles span{color:#A85D35}
html[data-mode=day] .lg3-h1 em{color:#A85D35}
html[data-mode=day] .lg3-lead{color:rgba(8,48,74,.78)}
html[data-mode=day] .lg3-hero .lg-btn.ghost{color:#08304A;border-color:rgba(8,48,74,.4)}html[data-mode=day] .lg3-hero .lg-btn.ghost:hover{background:#08304A;color:#FBF7F1;border-color:#08304A}
html[data-mode=day] .lg3-tag{background:rgba(251,247,241,.85);border-color:rgba(8,48,74,.14);color:rgba(8,48,74,.75)}html[data-mode=day] .lg3-tag b{color:#08304A}html[data-mode=day] .lg3-tag span{color:#A85D35}
html[data-mode=day]:not(.lg-scrolled) .lg-nav.dark .lg-brand,html[data-mode=day]:not(.lg-scrolled) .lg-nav.dark .lg-nav-links a,html[data-mode=day]:not(.lg-scrolled) .lg-nav.dark .lg-lang,html[data-mode=day]:not(.lg-scrolled) .lg-nav.dark .lg-mode,html[data-mode=day]:not(.lg-scrolled) .lg-nav.dark .lg-burger{color:#08304A!important;border-color:rgba(8,48,74,.3)!important}
html[data-mode=day] .lg3-more{background:#fff;border-color:rgba(8,48,74,.12)}
html[data-mode=day] .lg3-tile{background:#FBF7F1;border:1px solid rgba(8,48,74,.1)}
html[data-mode=day] .lg3-mark span,html[data-mode=day] .lg3-more-tag{color:#08304A}

html[data-mode=day] .lg-footer-meta a{color:#EB9A6A}

/* review fixes */
.lg-sec-head{max-width:min(100%,34ch)!important}
.lg3-more-sec{padding-bottom:40px}
@media(max-width:760px){
.lg-footer-links{flex-wrap:wrap;gap:4px 8px}.lg-footer-links a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}
.lg-footer-meta a,.lg3-more-link,.lg-quote footer a{display:inline-flex;align-items:center;min-height:44px}
.lg-footer-in{flex-direction:column;align-items:flex-start}.lg-footer-meta{text-align:start}
.lg-sec{padding:64px 0}

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="lg-i18n.js"></script>
<script type="text/babel" src="lg-ui.jsx"></script>
<script type="text/babel" src="lg-pages.jsx"></script>
<script type="text/babel" src="lg3-admin.jsx"></script>
<script type="text/babel" src="lg3-editor.jsx"></script>
<script type="text/babel">
const PAGES = ["home", "about", "book", "contact"];
function App() {
  const [c, save, reset] = useLg3Content();
  window.__lg3c = c;
  const [admin, setAdmin] = React.useState(null);
  const read = () => { const h = location.hash.slice(1); return PAGES.includes(h) ? h : "home"; };
  const [page, setPage] = React.useState(read);
  const [lang, setLang] = React.useState(() => localStorage.getItem("lg-lang") || "en");
  const [meet, setMeet] = React.useState(false);
  React.useEffect(() => { const f = () => document.documentElement.classList.toggle("lg-scrolled", window.scrollY > 40); f(); window.addEventListener("scroll", f, { passive: true }); return () => window.removeEventListener("scroll", f); }, []);
  const [mode, setMode] = React.useState(() => localStorage.getItem("lg-mode") || "night");
  React.useEffect(() => { document.documentElement.dataset.mode = mode; localStorage.setItem("lg-mode", mode); }, [mode]);
  React.useEffect(() => { const f = () => setPage(read()); window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  React.useEffect(() => { const f = () => setMeet(true); window.addEventListener("lg-meet", f); return () => window.removeEventListener("lg-meet", f); }, []);
  const [leaving, setLeaving] = React.useState(false);
  const go = (p) => { setMeet(false); if (p === page) { window.scrollTo({ top: 0, behavior: "smooth" }); return; } setLeaving(true); setTimeout(() => { history.replaceState(null, "", "#" + p); setPage(p); window.scrollTo(0, 0); setLeaving(false); }, 220); };
  const t = LG_T[lang];
  React.useEffect(() => { document.documentElement.dir = t.dir; document.documentElement.lang = lang; localStorage.setItem("lg-lang", lang); }, [lang]);
  const toggleLang = () => setLang(lang === "en" ? "ar" : "en");
  const P = { home: LgHome3, about: LgAbout, book: LgBook, contact: LgContact }[page];
  return (
    <>
      <LgNav t={t} page={page} go={go} toggleLang={toggleLang} dark={page === "home"} mode={mode} toggleMode={() => setMode(mode === "day" ? "night" : "day")} />
      <main key={page + lang + JSON.stringify(c).length} className={"lg-page" + (leaving ? " out" : "")}><P t={t} go={go} lang={lang} /></main>
      <LgFooter3 t={t} go={go} openAdmin={() => setAdmin("pin")} />
      <LgFab3 t={t} lang={lang} />
      <Lg3Glow />
      {admin === "pin" && <Lg3Pin onOk={() => setAdmin("open")} onClose={() => setAdmin(null)} />}
      {admin === "open" && <Lg3Admin c={c} save={save} reset={reset} close={() => setAdmin(null)} />}
      {meet && <Lg3AboutModal t={t} lang={lang} go={go} close={() => setMeet(false)} />}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
